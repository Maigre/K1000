---
# CamillaGUI v5 front-end settings for K1000 (installed next to camillagui.yml).
# The GUI re-reads this file on every page load; a syntax error stops the backend at start.
#
# Phone: open http://<box>:5005/gui/index.html?compactview
# The phone is for LEVELS only (plan §3): Main volume, mute and the meters. Those are runtime
# commands (/api/param/volume, /api/param/mute); they never send a config.
#
# Why there are NO custom_shortcuts: every shortcut move POSTs the WHOLE config the page loaded
# when it was opened (CamillaGUI v5 beta.2 never refreshes it). That silently reverts everything
# changed since then: knob moves (a feedback notch: the howl comes back), the system EQ applied at
# the tune (k1000 then adopts and saves the reverted values), a mono_subs change (a pipeline
# rebuild at show time) and, from a tab left open across a profile change, the devices (the engine
# restarts onto the other card; the HiFiBerry is not wired to the PA). PEQ, Lo-Cut and sub delay
# live on the knobs. Adding a shortcut back is a decision for Thomas, knowing all of the above.
#
# The compact view always shows two icons, "Change to normal view" and "Change to dashboard
# view" (no setting hides them). The normal view has Apply to DSP, Stop processing and an "Apply
# automatically" checkbox, none with a confirmation: the phone rule (README) is to stay in the
# compact view and never Apply or Stop from the phone.
#
# The Aux1/Aux2 faders (normal and dashboard views) are k1000's sub and top groups (balance macro
# +b/2, -b/2), not a balance control: k1000 pulls a raise back down, but keeps a cut or a mute
# (shown on the box screen) until it is undone here. The balance is E2 on the box.
page_title: K1000
# v0 runs one clock with no resampling and no multithreading: hide what does not apply.
hide_capture_samplerate: true
hide_silence: false
hide_capture_device: false
hide_playback_device: false
hide_rate_monitoring: true
hide_multithreading: true
# Laptop editor: explicit Apply, never automatic (Apply also sends the whole config: reload the
# page right before editing, see README).
apply_config_automatically: false
save_config_automatically: false
status_update_interval: 1000
# Main fader slider: -80..0 dB, the same as RANGES["master_db"] (0 dB is also the engine's volume_limit).
# One swipe can travel the whole slider in about half a second (+3 dB per touch event, sent every
# 250 ms, ramped over 100 ms). AFTER Friday's gain-structure step: volume_max = show level + 6 dB,
# volume_range = 80 + volume_max (the bottom stays at -80). Change it here and deploy (install.sh
# overwrites the box's copy); it applies at the next page load. The Aux sliders share this range.
volume_range: 80
volume_max: 0
spectrum_n_bins: 60
spectrum_max_rate: 10
spectrum_min_freq: 20
spectrum_max_freq: 20000
spectrum_min_db: -100
spectrum_max_db: 0
custom_shortcuts: []
