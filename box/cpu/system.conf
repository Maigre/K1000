# K1000 processor settings (box/cpu/, installed by box/install.sh as
# /etc/systemd/system.conf.d/50-k1000-cpu.conf; off with `install.sh --cpu-off`): every process
# runs on cores 0 and 1 unless its unit says otherwise. Only camilladsp.service does (cores 2 and
# 3, its own drop-in), so the audio engine has two cores that nothing else is scheduled on.
#
# PID 1 reads this at boot: it applies at the next boot. Kernel threads and interrupts are not
# affected (docs/manual/02-installation.md §6 says how to see where they run).
[Manager]
CPUAffinity=0 1
