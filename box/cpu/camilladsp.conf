# K1000 processor settings (box/cpu/, installed by box/install.sh as
# /etc/systemd/system/camilladsp.service.d/50-k1000-cpu.conf; off with `install.sh --cpu-off`).
#
# The audio engine on cores 2 and 3, alone: every other process is on 0 and 1 (system.conf.d).
# Its three real-time threads (capture, processing, playback) never wait behind a normal task
# anyway; what this buys is a core whose caches and run queue the Python service, CamillaGUI and
# the system do not touch, and distance from core 0, which handles the interrupts unless they are
# moved (/proc/interrupts).
# Only a directive: the unit's start script is untouched. Applies at the engine's next start.
[Service]
CPUAffinity=2 3
