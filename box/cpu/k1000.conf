# K1000 processor settings (box/cpu/, installed by box/install.sh as
# /etc/systemd/system/k1000.service.d/50-k1000-cpu.conf; off with `install.sh --cpu-off`).
#
# - Cores 0 and 1, with the rest of the system, away from the engine's 2 and 3.
# - Nice=5: under load, the control service yields to the system's own work on those cores (the
#   kernel threads that finish USB and network interrupts, which land on core 0 by default),
#   and still comes before CamillaGUI (Nice=10). Below full load nice changes nothing: the
#   service averages a fraction of one core. Set by systemd before it drops to user k1000.
# Applies at the service's next start.
[Service]
CPUAffinity=0 1
Nice=5
