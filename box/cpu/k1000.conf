# K1000 processor settings (box/cpu/, installed by box/install.sh as
# /etc/systemd/system/k1000.service.d/50-k1000-cpu.conf; off with `install.sh --cpu-off`).
#
# - Cores 0 and 1, with the rest of the system, away from the engine's 2 and 3.
# - Nice=5, intended and NOT verified: under load, the control service would yield to the
#   system's own work on those cores (the kernel threads that finish USB and network interrupts,
#   handled on core 0 unless moved) and still come before CamillaGUI (Nice=10). Likely no effect
#   today: each service runs in its own session, the kernel's autogroup is on, and then nice
#   only ranks k1000's own threads, which all get 5. To check on the box before relying on it
#   (docs/manual/02-installation.md §6, "Not set, on purpose"). Below full load nice changes
#   nothing anyway: the service averages a fraction of one core. Set by systemd before it drops
#   to user k1000.
# Applies at the service's next start.
[Service]
CPUAffinity=0 1
Nice=5
