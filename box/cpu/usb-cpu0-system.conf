# K1000 bench switch "usb-cpu0": core 0 left to the USB handling (D-023 point 3). Not installed by
# box/install.sh: k1000-usb-cpu0.service copies it to /run/systemd/system.conf.d/
# 51-k1000-usb-cpu0.conf when it starts, once k1000 and the engine have started, and removes it
# when it stops. /run is emptied at every boot, so the boot runs on the processor settings' cores
# 0 and 1 (until 16 Nov it sat in /etc and put the whole boot on core 1: 4 to 5 s later to full
# level). Off by default.
#
# Every process on core 1 alone unless its unit says otherwise: the engine keeps cores 2 and 3
# (camilladsp.conf), and core 0 is left to the M4's USB host, whose interrupt and completion work
# run there and cannot be moved (docs/manual/02-installation.md §6, "The bench switches").
#
# It sorts after 50-k1000-cpu.conf (cores 0 and 1). CPUAffinity= lines add up, so the empty one
# resets them first. The unit moves systemd itself (PID 1) to core 1 at once, so what it starts
# from then on inherits core 1; this file keeps it there across a daemon-reload (PID 1 reads
# /run/systemd/system.conf.d/ as well as /etc). Removed, the next daemon-reload gives systemd
# cores 0 and 1 again.
[Manager]
CPUAffinity=
CPUAffinity=1
