# K1000 bench switch "usb-cpu0": core 0 left to the USB handling (D-023 point 3). Installed by
# box/install.sh --usb-cpu0-on as /etc/systemd/system.conf.d/51-k1000-usb-cpu0.conf, with
# k1000-usb-cpu0.service; removed by --usb-cpu0-off and by --cpu-off. Off by default.
#
# Every process on core 1 alone unless its unit says otherwise: the engine keeps cores 2 and 3
# (camilladsp.conf), and core 0 is left to the M4's USB host, whose interrupt and completion work
# run there and cannot be moved (docs/manual/02-installation.md §6, "The bench switches").
#
# It sorts after 50-k1000-cpu.conf (cores 0 and 1). CPUAffinity= lines add up, so the empty one
# resets them first. PID 1 applies it at install.sh's daemon-reload, to what it starts from then
# on; k1000-usb-cpu0.service moves what already runs. Removed, the next daemon-reload gives
# systemd cores 0 and 1 again (50-k1000-cpu.conf is read alone).
[Manager]
CPUAffinity=
CPUAffinity=1
