# K1000 processor settings (box/cpu/, installed by box/install.sh as
# /etc/systemd/system/camillagui.service.d/50-k1000-cpu.conf; off with `install.sh --cpu-off`).
#
# CamillaGUI on cores 0 and 1, away from the engine's 2 and 3 (its own unit keeps Nice=10).
# Applies at its next start.
[Service]
CPUAffinity=0 1
