# K1000 bench switch "usb-cpu0" (usb-cpu0-system.conf says why). Installed by box/install.sh
# --usb-cpu0-on as /etc/systemd/system/k1000.service.d/51-k1000-usb-cpu0.conf; removed by
# --usb-cpu0-off and by --cpu-off. Off by default.
#
# The control service on core 1 alone, in place of the 0 and 1 of 50-k1000-cpu.conf (the empty
# line resets them; its Nice=5 stays). Applies at its next start: k1000-usb-cpu0.service has
# already moved the running one.
[Service]
CPUAffinity=
CPUAffinity=1
