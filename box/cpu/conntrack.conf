# K1000 processor settings (box/cpu/, installed by box/install.sh as
# /etc/modprobe.d/k1000-conntrack.conf; off with `install.sh --cpu-off`): the kernel's connection
# tracker gets a table of 1024 buckets instead of the default (262,144 on this 8 GB Pi 4).
#
# Why (docs/17-box-record-and-bench.md §14, 16 Nov): the phone Wi-Fi's fence (net/setup-ap.sh) uses
# connection tracking (`ct state`, `ct count`), which loads nf_conntrack. Once a minute its garbage
# collector sweeps every bucket of the table, on whatever core its timer fires, with preemption
# off: 7.3 to 7.7 ms each time, read in four kernel traces, for 13 tracked connections. On
# 16 Nov at 01:31 it ran on core 3 while the engine's capture thread waited there: the capture
# overran and the audio dropped out. The fence allows 64 connections in all, so 1024 buckets are
# far more than enough, and the sweep is about 250 times shorter.
#
# Read when the module loads (every boot). install.sh also resizes the running table at once
# (/proc/sys/net/netfilter/nf_conntrack_buckets) when the module is already loaded.
options nf_conntrack hashsize=1024
