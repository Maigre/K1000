# K1000 captive DNS, portal ON (`setup-ap.sh --portal on`; NOT the default, which is
# dnsmasq-k1000-noportal.conf; docs/06-phone.md §4-5). Installed by box/net/setup-ap.sh as
# /etc/NetworkManager/dnsmasq-shared.d/k1000.conf. Only the dnsmasq that serves the K1000 access
# point reads it (k1000-ap-dnsmasq.service with the default hostapd backend, or NetworkManager's
# shared-mode dnsmasq with `--backend nm`): the box's own name resolution is not affected.
#
# Every name answers with the box. A phone's connectivity probe (connectivitycheck.gstatic.com,
# captive.apple.com, ...) then lands on the k1000 captive portal on :80, which redirects, and
# Android raises "Sign in to network". The certificate's name, k1000.home.arpa, resolves too. The
# phone page itself is reached by IP (https://10.42.0.1/), so it works even when a phone ignores
# this DNS (Private DNS in strict mode).
#
# The cost (docs/06-phone.md §4): Android then sees a captive portal that never validates, so it
# never offers "Stay connected / Don't ask again" for K1000, and it pauses auto-joining K1000 after
# each automatic join (up to 10 min after a dropout, unless Wi-Fi is toggled). That is why the
# default is `--portal off` (dnsmasq-k1000-noportal.conf).
address=/#/10.42.0.1

# Since dnsmasq 2.86 a query of another type for an address= domain (AAAA, HTTPS/SVCB...) is
# forwarded upstream. local=/#/ answers those here (no data) instead: no query leaves the box,
# and phones never wait on an upstream that a gig does not have.
local=/#/
