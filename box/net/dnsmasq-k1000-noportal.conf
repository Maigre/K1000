# K1000 DNS, portal OFF: the default (`setup-ap.sh --portal off`; docs/06-phone.md §4-5). Installed
# by box/net/setup-ap.sh as /etc/NetworkManager/dnsmasq-shared.d/k1000.conf (dnsmasq-k1000.conf
# with `--portal on`). Only the dnsmasq that serves the K1000 access point reads it
# (k1000-ap-dnsmasq.service, or NetworkManager's shared-mode dnsmasq with `--backend nm`).
#
# Only the box's own name answers (k1000.home.arpa, the certificate's name); every other name is
# "no such domain" at once. A phone's connectivity probe then fails without finding a portal, so
# Android treats K1000 as a Wi-Fi WITHOUT internet: joined from Settings, it asks "Stay
# connected?" once; with "Don't ask again" it keeps K1000 and auto-joins it like any network
# (no pause after a dropout). The page is https://10.42.0.1/ (or the K1000 app); the first-time
# certificate page is http://10.42.0.1/ (the third QR on the box's PHONE page).
# host-record (not address=): the name then exists for every type, so its AAAA is "no data"
# (not "no such name", which a resolver could cache for the A too), and 10.42.0.1 has a PTR.
host-record=k1000.home.arpa,10.42.0.1

# Nothing is ever forwarded: every other name, and every other record type, is answered here.
local=/#/
