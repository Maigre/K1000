# /etc/k1000/k1000.yaml - K1000 box settings (read at start of the k1000 service).
# Missing or broken file = built-in defaults (same values as below). Edit, then restart k1000.

# Device profile. GIG RULE: `m4` (pinned - if the MOTU M4 is missing the screen says so, no
# fallback). `dev` = the Zynthian's HiFiBerry board, bench only (not wired to the speakers).
profile: dev

profiles:
  dev:
    capture_device: hw:sndrpihifiberry
    playback_device: hw:sndrpihifiberry
    capture_channels: 2
    playback_channels: 2
    capture_format: S32_LE
    playback_format: S32_LE
    input_map: [0, 1]            # program L, R = capture channels (0-based)
    probe: false                 # facts proven on the box; never opened by the probe
  m4:
    capture_device: hw:M4
    playback_device: hw:M4
    capture_channels: null       # null = probe the M4 (assumed 4 if it cannot be probed)
    playback_channels: null      # null = probe (assumed 4)
    capture_format: null         # null = best format the device offers (S32_LE first)
    playback_format: null
    input_map: [2, 3]            # program L, R = M4 line inputs 3-4 (0-based capture channels)
    output_map: [TopL, TopR, SubL, SubR]   # physical out1..out4 <- logical channel
    probe: true

# Physical -> logical controls (MCP23017 indices, see docs/03-v0-architecture.md §1).
# UNCONFIRMED DEFAULTS until SETUP > Knob test (HWTEST) on the box has identified every button
# and knob by physical position (README "Knobs and buttons"). Hold-B2 = MUTE and hold-B4 = RESET
# LIVE EQ are the same gesture: a wrong `buttons` order swaps them. Fix them here, then restart
# k1000, and label the buttons on the shell.
# Keys as read by k1000/ui/input_map.py (ControlMap.from_cfg); invalid entries -> these defaults.
controls:
  encoders: [0, 1, 2, 3]         # E1..E4 = physical encoder index
  pushes: [0, 1, 2, 3]           # push of E1..E4 = physical switch index (sw0..sw3)
  buttons: [4, 5, 6, 7]          # B1..B4 = physical switch index (sw4..sw7)
  reverse: [false, false, false, false]   # flip an encoder's direction
  # Contact transitions per click of each PHYSICAL encoder enc0..enc3 (1, 2 or 4; one number =
  # all four) and the A/B levels at a click ("11" = both contacts open; "idle" = whatever they
  # read at start). Measured by tools/k1000-knobtrace.py (docs/08-knob-precision.md).
  steps_per_detent: [4, 4, 4, 4]
  detent_ab: ["11", "11", "11", "11"]
  # Master-up guard (D-009): master may rise at most this many dB within any 2 s (knobs, phone
  # and console alike); further up-clicks are refused with "MASTER: SLOW DOWN". Down is never
  # limited. 0 = off.
  master_up_guard_db: 6.0

# The SHOW page's program spectrum (D-009): GetSpectrum on a second engine connection, polled
# ~10 times a second only while SHOW is displayed and SETUP > Spectrum is ON. `enabled: false`
# removes it entirely (no second connection; SETUP > Spectrum then says so): the gig no-go
# switch if Friday's rig test shows anything odd. Restart k1000 after a change.
spectrum:
  enabled: true

engine:
  url: ws://127.0.0.1:1234
  boot_gain_db: -40.0            # Main fader at connect, before the ramp to the saved master
  boot_ramp_s: 3.0

paths:
  state: /var/lib/k1000/state.json
  active_config: /var/lib/k1000/active.yml
  # venues: the 8 venue snapshots (docs/12). Unset = venues.json next to paths.state, so a run
  # with --state elsewhere never writes the live slots.

# Phone page (D-007, docs/06-phone.md): the box's own Wi-Fi "K1000" (net/setup-ap.sh: hostapd,
# 5 GHz ch 36, portal off) and K1000's page at https://10.42.0.1/ (certificate in /etc/k1000/tls).
# SETUP > Phone switches phone control on/off at run time; `enabled: false` here removes the phone
# servers entirely (knobs only). A Friday NO-GO is both: `enabled: false` here (then restart k1000)
# AND the access point off: sudo /opt/k1000/net/setup-ap.sh --down (it stays off across reboots
# and later install.sh --ap runs; back on: setup-ap.sh --up).
phone:
  enabled: true                  # false = no phone servers at all (the no-go; see above)
  max_clients: 4                 # phones connected at once
  notch_gain_db: -6.0            # 'notch here' on the phone: the new band's cut...
  notch_q: 8.0                   # ...and Q
  # address: 10.42.0.1           # the AP address (bind + URL host); setup-ap.sh sets it
  # https_port: 443              # the installable page (needs /etc/k1000/tls)
  # http_port: 80                # first-time page + CA download, captive portal with --portal on (0 = off)
  # plain_app: fallback          # plain-HTTP page on plain_port: fallback (no certificate) | always | off
  # plain_port: 8080
